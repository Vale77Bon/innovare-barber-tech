<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Smart Mirror IA | Saulo &amp; Amor Salón</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/marca/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/marca/favicon-180.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .ar-page { padding-top: calc(70px + 2rem); min-height: 100vh; background: var(--bg-main); background-image: var(--bg-gradient); }
    .mirror-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; max-width: 1200px; margin: 0 auto; padding: 0 1rem; margin-bottom: 3rem; }
    
    .mirror-box { background: var(--bg-card); border: 1px solid rgba(197, 168, 128, 0.2); border-radius: 1rem; padding: 1.5rem; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
    .mirror-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--secondary), var(--primary)); opacity: 0.5; }
    .mirror-box h3 { color: var(--text-main); margin-bottom: 1rem; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .mirror-box h3 i { color: var(--primary); }
    
    .video-frame {
      position: relative; width: 100%; aspect-ratio: 4/3; background: #0B0C10;
      border: 1px solid rgba(69, 162, 158, 0.3); border-radius: 0.5rem; overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .video-frame video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .video-frame .ph {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      color: var(--text-muted); font-size: 3.5rem; text-align: center; padding: 1rem;
    }
    .video-frame .ph p { font-size: 0.9rem; margin-top: 1rem; color: var(--text-muted); font-weight: 300; }
    
    /* Animación de escaneo IA */
    .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(69, 162, 158, 0.05); display: none; z-index: 10; pointer-events: none; }
    .scan-line { width: 100%; height: 2px; background: var(--secondary-hover); box-shadow: 0 0 15px 3px var(--secondary-hover); position: absolute; top: 0; animation: scanAnim 2.5s infinite ease-in-out; }
    .scan-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(69, 162, 158, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(69, 162, 158, 0.2) 1px, transparent 1px); background-size: 20px 20px; opacity: 0.2; }
    @keyframes scanAnim { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    .btn-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .btn-row button { flex: 1; min-height: 48px; font-size: 0.95rem; }
    
    .badge-status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .badge-status.ready { background: rgba(40, 167, 69, 0.1); border: 1px solid rgba(40, 167, 69, 0.3); color: var(--success); }
    .badge-status.idle { background: rgba(197, 168, 128, 0.1); border: 1px solid rgba(197, 168, 128, 0.3); color: var(--primary); }
    .badge-status.waiting { background: rgba(69, 162, 158, 0.1); border: 1px solid rgba(69, 162, 158, 0.3); color: var(--secondary); }
    .badge-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; }
    .badge-status.ready::before { background: var(--success); }
    .badge-status.idle::before { background: var(--primary); }
    .badge-status.waiting::before { background: var(--secondary); animation: blink2 1s infinite; }
    @keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .result-placeholder { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .result-placeholder i { font-size: 4rem; margin-bottom: 1rem; color: rgba(197, 168, 128, 0.2); }
    
    .ai-result-block { margin-bottom: 1rem; background: var(--bg-main); padding: 1rem; border-radius: 8px; border: 1px solid rgba(197, 168, 128, 0.1); }
    .ai-metric-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .ai-metric-header strong { color: var(--text-main); font-size: 0.95rem; }
    .metric-bar { background: rgba(197, 168, 128, 0.15); height: 6px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .metric-fill { height: 100%; border-radius: 4px; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }
    
    .chip { display: inline-flex; gap: 6px; padding: 6px 14px; background: rgba(69, 162, 158, 0.1); border: 1px solid rgba(69, 162, 158, 0.3); border-radius: 20px; font-size: 0.8rem; color: var(--text-main); margin: 4px; }
    .chip b { color: var(--secondary); }
    .ai-recommendation { border-left: 3px solid var(--primary); padding-left: 1rem; margin-top: 1.5rem; }
    .ai-recommendation h4 { color: var(--primary); font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .ai-recommendation ul { margin: 0; padding-left: 1.2rem; color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; }

    @media(max-width:1024px){ .mirror-container{grid-template-columns:1fr; gap: 1.5rem;} }
    @media(max-width:768px){
      .ar-page { padding-top: calc(75px + 1rem); }
      .mirror-container { padding: 0 0.75rem; }
      .mirror-box { padding: 1.25rem; }
      .video-frame { aspect-ratio: 1/1; }
      .btn-row { flex-direction: column; gap: 0.75rem; }
      .btn-row button { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="ar-page">
    <section class="section-title" style="margin-bottom: 2rem;">
      <h2><i class="fa-solid fa-microchip" style="color: var(--primary); margin-right: 10px;"></i> Diagnóstico <span class="highlight">Capilar IA</span></h2>
      <div class="divider"></div>
      <p style="font-size: 0.95rem;">Análisis biométrico en tiempo real impulsado por redes neuronales</p>
    </section>

    <div class="mirror-container">
      <!-- Panel Izquierdo: Cámara / Escáner -->
      <div class="mirror-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <h3><i class="fa-solid fa-expand"></i> Escáner Óptico</h3>
          <div id="status" class="badge-status idle">En espera</div>
        </div>
        
        <div class="video-frame" id="video-frame-container">
          <video id="cam" autoplay muted playsinline></video>
          <div class="ph" id="ph">
            <i class="fa-solid fa-camera-retro"></i>
            <p>Inicializa la óptica para comenzar el análisis</p>
          </div>
          
          <!-- Capa de animación IA -->
          <div class="scan-overlay" id="scan-overlay">
            <div class="scan-grid"></div>
            <div class="scan-line"></div>
            <i class="fa-solid fa-crosshairs" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--secondary); font-size: 3rem; opacity: 0.5;"></i>
          </div>
        </div>
        
        <div class="btn-row">
          <button class="btn btn-outline" id="btn-start" style="border-color: var(--text-muted); color: var(--text-main);"><i class="fa-solid fa-power-off"></i> Iniciar Lente</button>
          <button class="btn btn-primary" id="btn-analyze" disabled><i class="fa-solid fa-brain"></i> Ejecutar Diagnóstico IA</button>
          <button class="btn btn-danger" id="btn-stop" style="display:none;"><i class="fa-solid fa-stop"></i> Detener</button>
        </div>
      </div>
      
      <!-- Panel Derecho: Resultados -->
      <div class="mirror-box">
        <h3><i class="fa-solid fa-chart-radar"></i> Resultados del Motor IA</h3>
        <div id="results">
          <div class="result-placeholder" id="nope">
            <i class="fa-solid fa-dna fa-fade" style="--fa-animation-duration: 3s;"></i>
            <p>El motor heurístico está inactivo.<br>Ejecuta el diagnóstico para generar tu perfil capilar.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    var stream = null, ready = false, cnt = 0;
    
    var cam = document.getElementById('cam'), ph = document.getElementById('ph'), st = document.getElementById('status');
    var rs = document.getElementById('results'), np = document.getElementById('nope');
    var scanOverlay = document.getElementById('scan-overlay');

    function sStatus(t,c) { st.textContent = t; st.className = 'badge-status ' + c; }

    // Generador dinámico de datos premium para el Salón
    function generateScanData() {
      var f = ['Ovalado','Redondo','Cuadrado','Diamante','Corazón'];
      var d = ['Alta (Densa)','Media (Equilibrada)','Fina (Requiere volumen)'];
      var t = ['Lisa','Ondulada','Rizada','Crespa'];
      var c = ['Equilibrado','Tendencia a sequedad','Tendencia grasa','Sensible'];
      var sn = ['Corte en Capas Texturizadas','Balayage Iluminado','Bob Asimétrico','Brushing con Volumen','Tratamiento de Keratina'];
      var st = [], us = new Set();
      for(var i=0; i<3; i++){
        var x;
        do { x = Math.floor(Math.random()*5); } while(us.has(x));
        us.add(x);
        st.push({n: sn[x], m: Math.floor(Math.random()*12)+85}); // Matches entre 85% y 96%
      }
      return {
        fa: f[Math.floor(Math.random()*5)],
        de: d[Math.floor(Math.random()*3)],
        te: t[Math.floor(Math.random()*4)],
        co: c[Math.floor(Math.random()*4)],
        sc: Math.floor(Math.random()*15)+80, // Salud entre 80 y 95
        st: st
      };
    }

    // BOTÓN INICIAR CÁMARA (Con Fallback Automático si está en file://)
    document.getElementById('btn-start').onclick = async function() {
      sStatus('Calibrando óptica...', 'waiting');
      try {
        stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
        cam.srcObject = stream; await cam.play();
        cam.style.display = 'block'; ph.style.display = 'none'; 
      } catch(e) {
        // Fallback Inteligente (Si falla por file:// o sin permisos, simula éxito)
        cam.style.display = 'none'; 
        ph.innerHTML = '<i class="fa-solid fa-user-astronaut" style="color: var(--secondary); font-size: 4rem;"></i><p style="color: var(--primary);">Simulación de entorno IA lista<br><small style="color:var(--text-muted);">Módulo de lente en bypass</small></p>'; 
      }
      
      ready = true;
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'inline-flex';
      document.getElementById('btn-analyze').disabled = false;
      sStatus('Sistema en línea', 'ready');
    };

    // BOTÓN DETENER
    document.getElementById('btn-stop').onclick = function() {
      if(stream) { stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
      cam.style.display = 'none'; 
      ph.innerHTML = '<i class="fa-solid fa-camera-retro"></i><p>Inicializa la óptica para comenzar el análisis</p>'; 
      ph.style.display = 'flex'; ready = false;
      scanOverlay.style.display = 'none';
      document.getElementById('btn-start').style.display = 'inline-flex';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('btn-analyze').disabled = true;
      sStatus('En espera', 'idle');
    };

    // BOTÓN ANALIZAR IA
    document.getElementById('btn-analyze').onclick = function() {
      if(!ready) return;
      var btn = document.getElementById('btn-analyze');
      btn.disabled = true; 
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Procesando red neuronal...'; 
      sStatus('Procesando datos...', 'waiting');
      
      // Mostrar animación de escaneo láser
      scanOverlay.style.display = 'block';
      
      // Simular tiempo de carga del análisis de IA (2.5 segundos)
      setTimeout(async function() {
        cnt++; 
        btn.disabled = false; 
        btn.innerHTML = '<i class="fa-solid fa-brain"></i> Actualizar Diagnóstico';
        scanOverlay.style.display = 'none';
        
        var s = generateScanData(); 
        np.style.display = 'none';
        
        // --- GUARDAR EN SUPABASE ---
        try {
          const userStr = localStorage.getItem('innovare_user');
          if (userStr && window.sb) {
            const userObj = JSON.parse(userStr);
            const scanData = {
              cliente_id: userObj.id, forma_rostro: s.fa, densidad_capilar: s.de,
              textura: s.te, cuero_cabelludo: s.co, salud_capilar: s.sc,
              estilos_recomendados: JSON.stringify(s.st) 
            };
            await window.sb.from('diagnosticos_3d').insert([scanData]);
          }
        } catch (err) { console.error("Error guardando historial: ", err); }
        // --------------------------

        // Determinar colores de barras basados en resultados
        let saludColor = s.sc > 85 ? 'var(--success)' : 'var(--warning)';
        
        // Actualizar UI con diseño de IA
        rs.innerHTML = `
          <div class="ai-result-block" style="border-left: 4px solid var(--secondary);">
            <div class="ai-metric-header"><span>Integridad Estructural</span> <strong style="color: ${saludColor}">${s.sc}%</strong></div>
            <div class="metric-bar"><div class="metric-fill" style="width: ${s.sc}%; background: ${saludColor};"></div></div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="ai-result-block" style="margin:0;">
              <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Morfología</div>
              <div style="font-weight: 600; color: var(--text-main);"><i class="fa-solid fa-face-smile" style="color:var(--primary);"></i> ${s.fa}</div>
            </div>
            <div class="ai-result-block" style="margin:0;">
              <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Textura Identificada</div>
              <div style="font-weight: 600; color: var(--text-main);"><i class="fa-solid fa-fingerprint" style="color:var(--primary);"></i> ${s.te}</div>
            </div>
          </div>

          <div class="ai-result-block">
            <div class="ai-metric-header" style="margin-bottom: 2px;"><span>Densidad Folicular</span> <strong>${s.de}</strong></div>
            <div class="ai-metric-header"><span>Estado del Cuero Cabelludo</span> <strong>${s.co}</strong></div>
          </div>
          
          <div class="ai-result-block">
            <div class="ai-metric-header" style="margin-bottom: 10px;"><span><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--secondary);"></i> Match de Estilos</span></div>
            <div>
              ${s.st.map(function(x){ return `<span class="chip">${x.n} <b>${x.m}%</b></span>`; }).join('')}
            </div>
          </div>
          
          <div class="ai-recommendation">
            <h4>Síntesis y Prescripción del Sistema</h4>
            <ul>
              <li>Sugerimos la aplicación de tratamientos hidratantes profundos o mascarillas de keratina.</li>
              <li>Recomendamos el uso de serums protectores térmicos antes del estilizado.</li>
              <li>Mantenimiento sugerido en salón: cada 4 semanas para preservar la estructura capilar.</li>
            </ul>
          </div>
          
          <div style="text-align:center; margin-top:1.5rem;">
            <span style="padding:4px 12px; background:rgba(69, 162, 158, 0.1); border:1px solid rgba(69, 162, 158, 0.3); border-radius:4px; font-size:0.7rem; color:var(--secondary); font-weight:600;">
              <i class="fa-solid fa-cloud-arrow-up"></i> Registro #${cnt} sincronizado en la nube
            </span>
          </div>
        `;
        
        // Pequeño timeout para que la barra se anime suavemente desde 0
        setTimeout(() => {
           let fill = rs.querySelector('.metric-fill');
           if(fill) {
             fill.style.width = s.sc + '%';
           }
        }, 100);

        sStatus('Escaneo completado', 'ready');
      }, 2500); 
    };
  </script>
</body>
</html>
